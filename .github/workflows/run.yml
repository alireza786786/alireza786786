name: Auto Collect and Send Configs
on:
  schedule:
    - cron: "*/15 * * * *" # اجرا به صورت خودکار هر ۱۵ دقیقه یک‌بار
  workflow_dispatch: # امکان اجرا با یک کلیک دستی
permissions:
  contents: write
jobs:
  run-collector:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Collector Script with Secrets
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python collector.py
      - name: Commit and Push Files
        run: |
          git config --global user.name "Bot Collector"
          git config --global user.email "bot@users.noreply.github.com"
          git add subscription_part*.txt
          git add history.db
          git commit -m "chore: auto-update subscription files every 15 mins [skip ci]" || exit 0
          git push
          
