name: V2Ray Collector
on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:
concurrency: { group: collector, cancel-in-progress: false }

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - uses: actions/cache@v4
        with: { path: .xray_bin, key: xray-bin }
      - run: pip install -r requirements.txt
      - run: python v2ray_collector_v3.py
        env: { BOT_TOKEN: "${{ secrets.BOT_TOKEN }}", CHAT_ID: "${{ secrets.CHAT_ID }}" }
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: update subscription $(date -u +%F)"
          git push
